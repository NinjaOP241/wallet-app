services:
  postgres-shard1:
    image: postgres:17
    container_name: wallet-postgres-shard1
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wallet_shard1
    ports:
      - "5440:5432"
    volumes:
      - shard1-data:/var/lib/postgresql/data

  postgres-shard2:
    image: postgres:17
    container_name: wallet-postgres-shard2
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wallet_shard2
    ports:
      - "5441:5432"
    volumes:
      - shard2-data:/var/lib/postgresql/data

volumes:
  shard1-data:
  shard2-data:
